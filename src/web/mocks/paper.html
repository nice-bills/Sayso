<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayso mock · Paper</title>
<link rel="stylesheet" href="/mocks/surface.css">
<style>
  /* Mock 2, Paper: grainy cream stock, black ink, one orange, photo panels under frosted cards. The money visibly travels the wire. No gradients. */
  @font-face { font-family: "Instrument Serif"; src: url("/instrument-serif.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; src: url("/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }
  @font-face { font-family: "Figtree"; src: url("/figtree-vf.woff2") format("woff2"); font-weight: 300 900; }
  @font-face { font-family: "Martian Mono"; src: url("/martian-mono-vf.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
  :root { --bg: #f2efe8; --ink: #121210; --dim: #77736a; --line: #d9d4c8; --tile: #e8e4da; --acc: #ff4d2e; --ok: #1f7a4a; --ease: cubic-bezier(.22, 1, .36, 1);
    --glass: rgba(250, 248, 242, .62); --glass-line: rgba(255, 255, 255, .55); --glass-lip: rgba(255, 255, 255, .8); --blur: 18px; }
  * { box-sizing: border-box; }
  /* paper stock: the shared grain, inverted to dark fibres and multiplied into the cream */
  .grain { filter: invert(1); mix-blend-mode: multiply; --grain: .2; z-index: 5; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 48px) 80px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 22px 0; border-bottom: 1.5px solid var(--ink); }
  .brand { font: italic 30px "Instrument Serif", serif; letter-spacing: -.01em; }
  nav { display: flex; gap: 26px; font-size: 14px; }
  nav a { color: var(--dim); text-decoration: none; position: relative; padding: 4px 0; }
  nav a.on { color: var(--ink); }
  nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1.5px; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .45s var(--ease); }
  nav a.on::after, nav a:hover::after { transform: scaleX(1); }

  .hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 48px; padding: 56px 0 40px; border-bottom: 1px solid var(--line); align-items: end; }
  .k { font: 11px "Martian Mono", monospace; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  .bal { font: 400 clamp(84px, 12vw, 176px) "Instrument Serif", serif; line-height: .82; letter-spacing: -.035em; margin: 10px 0 0; font-variant-numeric: tabular-nums; }
  .bal em { color: var(--dim); }
  .askcard { border-radius: 26px; padding: 28px; min-height: 320px; display: flex; flex-direction: column; justify-content: flex-end; color: var(--bg); --scrim: rgba(18, 18, 16, .48); }
  .ask { font: italic clamp(28px, 3vw, 40px) "Instrument Serif", serif; line-height: 1.1; margin: 0 0 18px; }
  .ask .caret { display: inline-block; width: 2px; height: .9em; background: var(--acc); vertical-align: -3px; margin-left: 2px; animation: caret 1s steps(1) infinite; }
  .input { display: flex; gap: 10px; }
  .input > span { flex: 1; min-width: 0; height: 52px; border-radius: 999px; display: flex; align-items: center; padding: 0 20px; color: rgba(242, 239, 232, .82); --glass: rgba(255, 255, 255, .14); --glass-line: rgba(255, 255, 255, .28); --glass-lip: rgba(255, 255, 255, .35); font-size: 15px; }
  .input button { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--bg); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
  .bars { display: flex; gap: 3px; align-items: center; height: 18px; }
  .bars i { width: 3px; background: currentColor; border-radius: 2px; animation: eq 1s var(--ease) infinite; }
  .bars i:nth-child(2) { animation-delay: .15s; } .bars i:nth-child(3) { animation-delay: .3s; } .bars i:nth-child(4) { animation-delay: .45s; }

  /* the wire */
  .wire { padding: 40px 0; border-bottom: 1px solid var(--line); }
  .wire-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
  .wire-head h2 { font: 400 clamp(30px, 3.4vw, 46px) "Instrument Serif", serif; margin: 0; letter-spacing: -.01em; }
  .wire-head h2 b { font-weight: 400; color: var(--acc); }
  .track { position: relative; height: 84px; margin: 0 14px; }
  .line, .lit { position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: var(--line); }
  .lit { right: auto; width: 0; background: var(--ink); transition: width 1.1s var(--ease); }
  .st { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; font-size: 13px; font-weight: 600; text-align: center; }
  .st i { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2px var(--ink); transition: background-color .4s, box-shadow .4s; }
  .st.hit i { background: var(--ink); }
  .st.gate i { border-radius: 8px; }
  .st small { display: block; font: 400 11px "Martian Mono", monospace; color: var(--dim); }
  .coin { position: absolute; top: 5px; left: 0; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--acc); transition: left 1.1s var(--ease); z-index: 2; }
  .coin b { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 11px "Martian Mono", monospace; background: var(--ink); color: var(--bg); padding: 4px 8px; border-radius: 5px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 48px; padding-top: 40px; }
  .need { display: grid; gap: 12px; padding: 16px; border-radius: 26px; min-height: 420px; align-content: start; --scrim: rgba(18, 18, 16, .3); }
  .item { border-radius: 18px; padding: 20px 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; transition: transform .5s var(--ease), opacity .4s, background-color .4s; animation: in .7s var(--ease) both; }
  .item:nth-child(2) { animation-delay: .1s; } .item:nth-child(3) { animation-delay: .2s; }
  .item .who { font-weight: 600; } .item .why { grid-column: 1; font-size: 13px; color: var(--dim); }
  .item .amt { font: 400 34px "Instrument Serif", serif; grid-row: 1 / 3; grid-column: 2; }
  .item .acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 10px; }
  .item button { height: 40px; padding: 0 18px; border-radius: 999px; border: 0; font: 600 14px "Figtree", sans-serif; cursor: pointer; transition: transform .2s var(--ease); }
  .item button:active { transform: scale(.95); }
  .item .yes { background: var(--ink); color: var(--bg); } .item .no { background: rgba(18, 18, 16, .08); color: var(--ink); }
  .item.paid { background: rgba(18, 18, 16, .78); color: var(--bg); } .item.paid .why { color: #b8b3a8; }
  .item.gone { opacity: 0; transform: translateX(40px); }
  .stamp { grid-column: 1 / -1; font: 600 12px "Martian Mono", monospace; color: var(--acc); animation: stamp .5s var(--ease); }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 15px 0; border-top: 1px solid var(--line); font-size: 15px; vertical-align: top; }
  tr { animation: in .6s var(--ease) both; }
  tr:nth-child(2) { animation-delay: .06s; } tr:nth-child(3) { animation-delay: .12s; } tr:nth-child(4) { animation-delay: .18s; } tr:nth-child(5) { animation-delay: .24s; }
  td small { display: block; color: var(--dim); font-size: 12px; margin-top: 3px; }
  .v { font: 600 11px "Martian Mono", monospace; width: 64px; }
  .v.pay { color: var(--ok); } .v.hold { color: var(--acc); }
  .r { text-align: right; font: 500 15px "Martian Mono", monospace; }

  @keyframes caret { 50% { opacity: 0; } }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 18px; } }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  @keyframes stamp { from { opacity: 0; transform: scale(1.6) rotate(-6deg); } }
  @media (max-width: 860px) { .hero, .cols { grid-template-columns: minmax(0, 1fr); } nav { display: none; } .st { font-size: 11px; } .st small { display: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="wrap">
  <header><span class="brand">sayso</span><nav><a class="on" href="#">Home</a><a href="#">Inbox</a><a href="#">Agents</a><a href="#">Payments</a></nav><span class="k">Offline demo</span></header>
  <section class="hero">
    <div><span class="k">Available to your agents</span><p class="bal">$1,496<em>.03</em></p></div>
    <div class="askcard photo"><span class="ph"><img src="/people/invoices.jpg" alt=""></span><p class="ask" id="ask"></p><div class="input"><span class="glass">Hold the mic, or type it</span><button aria-label="Hold to talk"><span class="bars"><i></i><i></i><i></i><i></i></span></button></div></div>
  </section>
  <section class="wire">
    <div class="wire-head"><h2 id="wire-title">€95.50 to Rechenzentrum Nord: <b>pay</b>.</h2><span class="k" id="wire-note">Watching the money move</span></div>
    <div class="track" id="track"><span class="line"></span><span class="lit" id="lit"></span><span class="coin" id="coin"><b id="coin-tag">108.59 USDZ</b></span></div>
  </section>
  <div class="cols">
    <section><p class="k" style="margin:0 0 14px"><span id="n">3</span> need you</p><div class="need photo" id="need"></div></section>
    <section><p class="k" style="margin:0 0 14px">What Sayso decided</p><table><tbody id="rows"></tbody></table></section>
  </div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  // the sentence types itself, one line after another
  const LINES = ["“Pay Holloway Print £72.”", "“Tip the writers a dollar each.”", "“Hold anything from Kreuzberg.”"];
  let li = 0;
  (function type() {
    const t = LINES[li++ % LINES.length]; let i = 0;
    const step = () => { $("#ask").innerHTML = t.slice(0, i) + '<span class="caret"></span>'; if (i++ < t.length) setTimeout(step, 45); else setTimeout(type, 2400); };
    step();
  })();

  // the wire: agent → Sayso → Metal → Airwallex → payee, on a loop
  const ST = [["Agent", "asks", 0], ["Sayso", "decides", 25], ["Metal", "USDZ", 50], ["Airwallex", "EUR", 75], ["Payee", "paid", 100]];
  const track = $("#track");
  const nodes = ST.map(([k, s, x], i) => { const el = document.createElement("span"); el.className = `st${i === 1 ? " gate" : ""}`; el.style.left = `${x}%`; el.innerHTML = `<i></i><span>${k}<small>${s}</small></span>`; track.append(el); return el; });
  const NOTES = ["Your agent asks to pay", "Sayso checks price, balance, payee", "Paid in USDZ on Metal", "Airwallex converts to EUR", "Delivered. Receipt hashed."];
  let at = 0;
  function move() {
    at = (at + 1) % ST.length;
    if (at === 0) nodes.forEach((n) => n.classList.remove("hit"));
    nodes[at].classList.add("hit"); nodes[0].classList.add("hit");
    $("#coin").style.left = `${ST[at][2]}%`; $("#lit").style.width = `${ST[at][2]}%`;
    $("#coin-tag").textContent = at >= 3 ? "€95.50" : "108.59 USDZ";
    $("#wire-note").textContent = NOTES[at];
    setTimeout(move, at === ST.length - 1 ? 2600 : 1500);
  }
  nodes[0].classList.add("hit"); setTimeout(move, 900);

  const NEED = [["Kreuzberg Studio GmbH", "New bank details, never paid", "€340"], ["Berlin Office Lettings", "Over your $50 line", "€60"], ["Holloway Print Ltd", "Waiting for the agent's top-up", "£72"]];
  function needs() {
    $("#need").innerHTML = '<span class="ph"><img src="/people/closing.jpg" alt=""></span>';
    NEED.forEach(([who, why, amt]) => {
      const el = document.createElement("article"); el.className = "item glass";
      el.innerHTML = `<span class="who">${who}</span><span class="amt">${amt}</span><span class="why">${why}</span><div class="acts"><button class="yes">Approve</button><button class="no">Deny</button></div>`;
      el.querySelector(".yes").onclick = () => settle(el, "Approved · paying now");
      el.querySelector(".no").onclick = () => settle(el, "Denied · nothing moved");
      $("#need").append(el);
    });
    $("#n").textContent = NEED.length;
  }
  function settle(el, word) {
    el.querySelector(".acts").remove(); el.classList.add("paid");
    const s = document.createElement("span"); s.className = "stamp"; s.textContent = word; el.append(s);
    setTimeout(() => el.classList.add("gone"), 1400);
    setTimeout(() => { el.remove(); const left = $("#need").querySelectorAll(".item").length; $("#n").textContent = left; if (!left) setTimeout(needs, 900); }, 1900);
  }
  needs();
  const ROWS = [["PAY", "Lingua Freelance", "Agent · 8 hours ago", "€180.00", "Delivered"], ["HOLD", "Kreuzberg Studio GmbH", "Inbox · 8 hours ago", "€340.00", "Needs review"], ["PAY", "Holloway Print Ltd", "Inbox · 8 hours ago", "£72.00", "Waiting for payment"], ["HOLD", "Berlin Office Lettings", "Inbox · 8 hours ago", "€60.00", "Needs review"], ["PAY", "Kreuzberg Studio GmbH", "Inbox · 3 days ago", "€280.00", "Delivered"]];
  $("#rows").innerHTML = ROWS.map(([v, who, sub, amt, st]) => `<tr><td class="v ${v.toLowerCase()}">${v}</td><td>${who}<small>${sub}</small></td><td class="r">${amt}<small>${st}</small></td></tr>`).join("");
</script>
</body>
</html>
